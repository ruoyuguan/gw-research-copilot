name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install GWRC and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check console entry point
        run: gwrc --help
      - name: Check optional dependency reporting
        run: gwrc doctor --json
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check dependency consistency
        run: python -m pip check

  package:
    name: build and wheel smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Install and exercise the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          gwrc fisher-demo --output-dir "$RUNNER_TEMP/gwrc-wheel-fisher"
          python -m pip check

  ci:
    name: ci
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
